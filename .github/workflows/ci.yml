name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # One job, one install: keeps Actions minutes low. Each step still fails the run independently.
    name: Lint, typecheck, build, audit, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # The mock catalog still drives the build; Shopify vars are validated at
          # server start, not build time. Remove SHOPIFY_OPTIONAL once the store exists.
          SHOPIFY_OPTIONAL: "1"
      # Policy: no high or critical advisories in the resolved dependency tree.
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
